# ============================================
# MovieTracker - Docker Compose
# - movietracker: Frontend React SPA served by Nginx
# - telegram-bot: Telegram Bot listener & alert monitoring daemon
# ============================================

services:
  movietracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movietracker
    restart: unless-stopped
    ports:
      - "80:80"

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: movietracker-bot
    restart: unless-stopped
    env_file:
      - .env
