# ============================================
# MovieTracker - Docker Compose (single container)
# - movietracker: Frontend React SPA served by Nginx
# Backend logic runs as Supabase Edge Functions;
# the Telegram bot uses a webhook (registered once,
# not run as a container) and pg_cron schedules the
# every-minute alert scanner.
# ============================================

services:
  movietracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movietracker
    restart: unless-stopped
    ports:
      - "80:80"
